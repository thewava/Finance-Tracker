<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Finance Tracker</h1>
    <p>Search a stock ticker to see live price data and recent history.</p>
  </header>

  <main>
    <section class="search-bar">
      <input type="text" id="tickerInput" placeholder="Enter ticker (e.g. AAPL, QQQ)">
      <button id="searchBtn">Search</button>
    </section>

    <section id="statusMessage" class="status hidden"></section>

    <section id="quoteCard" class="quote-card hidden">
      <h2 id="quoteSymbol"></h2>
      <p class="price" id="quotePrice"></p>
      <p id="quoteChange"></p>
      <p id="quoteVolume"></p>
    </section>

    <section id="chartSection" class="chart-section hidden">
      <h3>Last 30 Days</h3>
      <canvas id="priceChart"></canvas>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js"></script>
</body>
</html>
